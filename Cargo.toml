[package]
name = "cuadros"
version = "0.1.0"
edition = "2021"
description = "Cuadros agrupadores para el escritorio de Windows"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fontdue = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico", "webp", "bmp"] }
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "x11"] }

[dependencies.windows]
version = "0.62"
default-features = false
features = [
    "std",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
